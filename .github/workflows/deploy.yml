name: Deploy to Hostinger
on:
  push:
    branches: [deploy/hostinger]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: تشغيل سكربت التحديث على الاستضافة
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # النشر الحقيقي: سحب الكود وتثبيت الحزم والهجرات وبناء الذاكرة.
            # نجاحه وحده يحدّد لون التشغيل.
            bash ~/update-hostinger.sh || DEPLOY_FAILED=1

            # خطوات سلامة اختيارية بعده: حذف ملف صنف من المستودع قد يترك
            # خريطة أصناف composer تشير إلى ملف مفقود فيعجز artisan عن
            # الإقلاع. هذه محاولة إصلاح — فشلها لا يصبغ النشر بالأحمر.
            echo "── خطوات السلامة ──"
            cd ~/bahja 2>/dev/null && {
              composer dump-autoload --optimize --no-interaction --no-scripts || echo "تخطّي: تعذّرت إعادة توليد خريطة الأصناف"
              php artisan optimize:clear || echo "تخطّي: تعذّر مسح الذاكرة"
              php artisan optimize || echo "تخطّي: تعذّرت إعادة بناء الذاكرة"
              php artisan about --only=environment || true
            }

            exit ${DEPLOY_FAILED:-0}
