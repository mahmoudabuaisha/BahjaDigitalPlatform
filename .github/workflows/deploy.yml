name: Deploy to Hostinger
on:
  push:
    branches: [deploy/hostinger]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: تشغيل سكربت التحديث على الاستضافة
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set +e
            echo "════════ محتوى سكربت النشر على الاستضافة ════════"
            cat ~/update-hostinger.sh

            echo "════════ تشغيل النشر (بتتبّع كل أمر) ════════"
            bash -x ~/update-hostinger.sh 2>&1 | tail -70
            DEPLOY_CODE=${PIPESTATUS[0]}
            echo "════════ رمز خروج سكربت النشر: $DEPLOY_CODE ════════"

            cd ~/bahja 2>/dev/null && {
              echo "── محاولة إصلاح الذاكرة (اختيارية) ──"
              php artisan optimize:clear 2>&1 | tail -12 || echo "تخطّي: مسح الذاكرة"
              php artisan optimize 2>&1 | tail -12 || echo "تخطّي: بناء الذاكرة"
            }

            exit $DEPLOY_CODE
