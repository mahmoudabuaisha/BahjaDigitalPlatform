name: Deploy to Hostinger
on:
  push:
    branches: [deploy/hostinger]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: تشغيل سكربت التحديث على الاستضافة
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set +e
            cd ~/bahja || exit 1

            # تحصين قبل النشر: سحب الكود ثم إعادة توليد خريطة أصناف composer
            # ومسح ذاكرة Laravel بـ rm مباشرة. هذا يكسر الطوق الذي أوقع الموقع
            # سابقاً: حذف ملف صنف يجعل artisan يعجز عن الإقلاع، فتفشل
            # optimize:clear قبل أن تمسح الذاكرة القديمة.
            echo "════ تحصين ما قبل النشر ════"
            git fetch --all --prune && git reset --hard origin/deploy/hostinger
            composer dump-autoload --optimize --no-interaction --no-scripts
            rm -f bootstrap/cache/*.php
            rm -rf bootstrap/cache/filament

            echo "════ تشغيل النشر ════"
            bash -x ~/update-hostinger.sh 2>&1 | tail -70
            DEPLOY_CODE=${PIPESTATUS[0]}
            echo "════ رمز خروج سكربت النشر: $DEPLOY_CODE ════"

            exit $DEPLOY_CODE
