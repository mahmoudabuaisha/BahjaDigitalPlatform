name: ضبط البريد على الاستضافة

# يُشغَّل يدوياً من تبويب Actions: يضبط SMTP في .env على صندوق البريد، ويعيد بناء
# الكاش، ويرسل رسالة اختبار، ويصرّف الطابور، ويضيف كرون schedule:run إن كان غائباً.
# كلمة مرور الصندوق تُقرأ من السرّ MAIL_PASSWORD في إعدادات المستودع ولا تُطبع أبداً.
on:
  workflow_dispatch:
    inputs:
      mail_username:
        description: 'صندوق البريد الذي ترسل منه المنصّة'
        default: 'info@bahjagaza.com'
        required: true
      test_to:
        description: 'بريد يُرسَل إليه اختبار فوري (اتركوه فارغاً لتخطّي الاختبار)'
        default: 'info@bahjagaza.com'
        required: false
      install_cron:
        description: 'إضافة كرون schedule:run إن كان غائباً'
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: ضبط SMTP واختبار الإرسال على الاستضافة
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAIL_USERNAME: ${{ inputs.mail_username }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          TEST_TO: ${{ inputs.test_to }}
          INSTALL_CRON: ${{ inputs.install_cron }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: MAIL_USERNAME,MAIL_PASSWORD,TEST_TO,INSTALL_CRON
          script: |
            # فحص مؤقّت للاستضافة (يعمل من هذا الفرع فقط): الطابور وأقفال الجدولة والكرون
            cd ~/bahja || exit 1
            echo "════ PHP"
            php -v | head -1
            php -r 'echo "sapi=".PHP_SAPI."  proc_open=".(function_exists("proc_open")?"yes":"no")."  disable_functions=[".ini_get("disable_functions")."]\n";'
            echo "════ البيئة"
            echo "QUEUE_CONNECTION=$(grep -E '^QUEUE_CONNECTION=' .env | cut -d= -f2-)  CACHE_STORE=$(grep -E '^CACHE_STORE=' .env | cut -d= -f2-)  APP_ENV=$(grep -E '^APP_ENV=' .env | cut -d= -f2-)"
            echo "════ الطابور وأقفال الجدولة"
            php artisan tinker --execute='
            echo "jobs في الانتظار: ".DB::table("jobs")->count().PHP_EOL;
            $oldest = DB::table("jobs")->min("created_at");
            echo "أقدمها: ".($oldest ? date("Y-m-d H:i:s", $oldest) : "—").PHP_EOL;
            echo "failed_jobs: ".DB::table("failed_jobs")->count().PHP_EOL;
            foreach (app(Illuminate\Console\Scheduling\Schedule::class)->events() as $event) {
                echo ($event->mutex->exists($event) ? "LOCKED " : "free   ").$event->expression."  ".$event->getSummaryForDisplay().PHP_EOL;
            }
            '
            echo "════ أخطاء السجلّ (آخر 3، بلا عناوين بريد)"
            grep -E "\.ERROR" storage/logs/laravel.log 2>/dev/null | tail -n 3 | cut -c1-220 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g' || echo "لا أخطاء"
            echo "════ الكرون"
            crontab -l 2>/dev/null || echo "crontab غير متاح عبر SSH"
